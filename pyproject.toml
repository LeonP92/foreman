[project]
name = "foreman"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow'"
markers = [
  "browser: needs a real browser (Node + Playwright)",
  "slow: takes seconds; CI's test job runs it",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]
