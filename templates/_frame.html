<header class="topbar">
  <div class="bar-row">
    <div class="bar-title"><h1 id="title">/*__TITLE__*/</h1><p id="notes"></p></div>
    <div class="seg" id="seg" role="group" aria-label="View">
      <button type="button" data-mode="graph">Graph</button><button type="button" data-mode="matrix">Matrix</button>
    </div>
    <label class="filter">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="m10.5 10.5 3.5 3.5"/></svg>
      <input id="filter" type="text" autocomplete="off" spellcheck="false">
      <kbd id="filter-key"></kbd>
    </label>
    <button class="icon-btn" type="button" popovertarget="legend">Legend</button>
    <button class="icon-btn" type="button" id="theme" aria-label="Toggle light and dark theme" title="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="bar-row bar-chips" id="chips"></div>
</header>
<div class="view">
  <main class="canvas" id="canvas"><div class="stage" id="stage"><svg id="g"></svg></div></main>
  <aside id="drawer" class="drawer" aria-label="Details">
    <button class="icon-btn drawer-close" type="button" aria-label="Close details">
      <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
    </button>
    <div class="drawer-body"></div>
  </aside>
</div>
